<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تهامي للويب | Tohami Web</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body data-theme="dark">
    <header class="navbar glass">
        <div class="nav-container" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <a href="index.html" class="logo"><span class="gradient-text">Tohami</span> Web 🚀</a>
            <nav class="nav-links" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                <a href="index.html" class="active">الرئيسية</a>
                <a href="./pages/courses.html">التعلم</a>
                <a href="./pages/playground.html">المحرر</a>
                <a href="./pages/login.html" style="background: rgba(99,102,241,0.2); padding: 5px 12px; border-radius: 6px; color: white;">دخول</a>
                <!-- زر تبديل الثيم -->
                <button id="theme-toggle-btn" onclick="toggleTheme()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem;">🌙</button>
            </nav>
        </div>
    </header>
    <section class="hero-section" style="padding: 140px 20px 60px; text-align: center;">
        <span class="badge" style="background: rgba(99,102,241,0.2); padding: 6px 16px; border-radius: 50px; font-size: 0.85rem;">المنصة العربية الأحدث لتطوير الويب 💡</span>
        <h1 style="font-size: 2.5rem; margin: 20px 0;">من أول سطر كود إلى موقع منشور على الإنترنت 🚀</h1>
        <p style="color: #94a3b8; max-width: 600px; margin: 0 auto 30px;">تعلم كيف تبني مواقع الويب، صمم صفحات احترافية، وجرّب الكود مباشرة.</p>
        <a href="./pages/courses.html" class="btn btn-primary" style="background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">ابدأ التعلم الآن</a>
    </section>

    <script>
        const savedTheme = localStorage.getItem('webcraft_theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeButtonIcon(savedTheme);

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('webcraft_theme', newTheme);
            updateThemeButtonIcon(newTheme);
        }

        function updateThemeButtonIcon(theme) {
            const btn = document.getElementById('theme-toggle-btn');
            if(btn) btn.innerText = theme === 'dark' ? '🌙' : '☀️';
        }
    </script>
    <script src="./data/courses.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
