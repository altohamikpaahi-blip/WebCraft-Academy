<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الأكواد الحي | WebCraft Academy</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .playground { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 75vh; margin-top: 100px; padding: 0 20px; }
        .editors { display: flex; flex-direction: column; gap: 10px; height: 100%; }
        textarea { width: 100%; height: 33%; background: #0f172a; color: #f8fafc; border: 1px solid rgba(255,255,255,0.08); padding: 10px; border-radius: 8px; font-family: monospace; resize: none; outline: none; }
        iframe { width: 100%; height: 100%; background: white; border-radius: 8px; border: none; }
        @media(max-width: 768px) { .playground { grid-template-columns: 1fr; height: auto; } textarea { height: 180px; } iframe { height: 300px; } }
    </style>
</head>
<body data-theme="dark">
    <header class="navbar glass">
        <div class="nav-container" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
            <a href="../index.html" class="logo"><span class="gradient-text">WebCraft</span> Academy 🚀</a>
            <a href="../index.html" style="background: transparent; color: white; border: 1px solid rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 0.9rem;">الرئيسية</a>
        </div>
    </header>

    <div class="playground">
        <div class="editors">
            <textarea id="html-code" placeholder="HTML Code..." oninput="runCode()"><h1>مرحباً بك في محرّر WebCraft 💻</h1></textarea>
            <textarea id="css-code" placeholder="CSS Code..." oninput="runCode()">h1 { color: #6366f1; text-align: center; margin-top: 40px; font-family: sans-serif; }</textarea>
            <textarea id="js-code" placeholder="JavaScript Code..." oninput="runCode()"></textarea>
        </div>
        <div style="background: rgba(19, 28, 49, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px; display: flex; flex-direction: column;">
            <span style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px;">المعاينة الحية:</span>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        function runCode() {
            const html = document.getElementById('html-code').value;
            const css = '<style>' + document.getElementById('css-code').value + '</style>';
            const js = '<script>' + document.getElementById('js-code').value + '<\/script>';
            const frame = document.getElementById('preview-frame');
            const doc = frame.contentDocument || frame.contentWindow.document;
            doc.open();
            doc.write(html + css + js);
            doc.close();
        }
        runCode();
    </script>
</body>
</html>
