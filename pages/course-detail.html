<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المسار والاختبار | WebCraft Academy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="dark">
    <header class="navbar glass">
        <div class="nav-container" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
            <a href="../index.html" class="logo"><span class="gradient-text">WebCraft</span> Academy 🚀</a>
            <nav class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="courses.html">التعلم</a>
                <a href="playground.html">المحرر</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 140px; padding-bottom: 60px; max-width: 800px; margin: 0 auto;">
        <div class="glass-card" style="padding: 30px;">
            <h2 id="c-title" style="color: var(--accent); margin-bottom: 10px; font-size: 1.8rem;">جاري تحميل المسار...</h2>
            <p id="c-desc" style="color: var(--text-secondary); margin-bottom: 20px; font-size: 1.05rem;"></p>
            
            <!-- شريط تقدم الإنجاز (Progress Bar) -->
            <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.9rem; color: #f8fafc;">
                    <span>📊 نسبة إنجاز المسار:</span>
                    <span id="progress-text" style="color: #38bdf8; font-weight: bold;">0%</span>
                </div>
                <div style="width: 100%; background: #020617; height: 10px; border-radius: 5px; overflow: hidden;">
                    <div id="progress-bar" style="width: 0%; height: 100%; background: linear-gradient(135deg, #6366f1, #a855f7); transition: width 0.4s ease;"></div>
                </div>
            </div>

            <!-- قائمة الدروس -->
            <div style="background: rgba(15, 23, 42, 0.9); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 30px;">
                <h3 style="margin-bottom: 15px; color: #f8fafc; font-size: 1.2rem;">📚 محتويات المنهج والشروحات:</h3>
                <ul id="lessons-list" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px;">
                    <!-- الدروس تظهر ديناميكياً -->
                </ul>
            </div>

            <!-- قسم الاختبار القصير (Quiz Section) -->
            <div style="background: rgba(99, 102, 241, 0.05); padding: 22px; border-radius: 12px; border: 1px solid rgba(99, 102, 241, 0.2);">
                <h3 style="color: var(--accent); margin-bottom: 10px; font-size: 1.3rem;">🎯 اختبار قصير لاختبار فهمك:</h3>
                <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">أجب على الأسئلة التالية لتتأكد من استيعابك للمنهج:</p>
                
                <div id="quiz-container" style="display: flex; flex-direction: column; gap: 20px;">
                    <!-- الأسئلة تظهر هنا ديناميكياً -->
                </div>

                <button onclick="submitQuiz()" class="btn btn-primary" style="margin-top: 20px; width: 100%; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">تصحيح الإجابات ⚡</button>
                
                <div id="quiz-result" style="margin-top: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; display: none;"></div>
            </div>

            <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 12px;">
                <a href="playground.html" class="btn btn-primary" style="text-decoration: none; text-align: center; padding: 14px; border-radius: 8px; font-weight: bold; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 1rem;">الانتقال للمحرر التجريبي 💻</a>
                <a href="courses.html" style="background: rgba(255,255,255,0.03); color: white; border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 8px; text-decoration: none; text-align: center; font-weight: bold;">العودة للمسارات</a>
            </div>
        </div>
    </main>

    <!-- نافذة الدرس المنبثقة -->
    <div id="lesson-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 15px;">
        <div style="background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 100%; max-width: 650px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); position: relative; max-height: 90vh; overflow-y: auto; text-align: right; direction: rtl;">
            <button onclick="closeLessonModal()" style="position: absolute; top: 15px; left: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
            <h3 id="modal-lesson-title" style="color: var(--accent); margin-bottom: 20px; font-size: 1.35rem; padding-left: 40px; line-height: 1.5;"></h3>
            <div style="margin-bottom: 20px;">
                <h4 style="color: #38bdf8; margin-bottom: 10px; font-size: 1rem;">📖 شرح الدرس المفصل:</h4>
                <div id="modal-lesson-content" style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.9;"></div>
            </div>
            <div style="background: #020617; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">
                <span style="color: #94a3b8; font-size: 0.85rem; display: block; margin-bottom: 6px;">💻 مثال تطبيقي:</span>
                <pre style="direction: ltr; text-align: left; background: #090d16; padding: 14px; border-radius: 8px; overflow-x: auto; color: #38bdf8; font-family: monospace; font-size: 0.9rem; margin: 0;"><code id="modal-lesson-code"></code></pre>
            </div>
            <button id="complete-btn" onclick="toggleLessonComplete()" style="width: 100%; background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-bottom: 12px;">تحديد كمكتمل ✅</button>
            <button onclick="closeLessonModal()" style="width: 100%; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">إغلاق والعودة للمنهج</button>
        </div>
    </div>

    <script>
        const COURSES_DATABASE = {
            "html": {
                title: "أساسيات HTML5",
                icon: "🧱",
                description: "تعلم هيكلة صفحات الويب وكتابة العناصر الأساسية بطريقة احترافية.",
                lessons: [
                    { title: "الدرس الأول: مقدمة إلى الويب وهيكل لغة HTML", content: "لغة HTML هي حجر الأساس لبناء صفحات الويب وتحتوي على وسوم الهيكل الأساسي.", code: "<!DOCTYPE html>\n<html>\n  <head><title>صفحتي</title></head>\n  <body><h1>مرحباً</h1></body>\n</html>" },
                    { title: "الدرس الثاني: الوسوم الأساسية، النصوص، والروابط", content: "تتعلم العناوين H1-H6، الفقرات p، والروابط a.", code: "<h1>عنوان</h1>\n<p>فقرة نصية</p>\n<a href='#'>رابط</a>" },
                    { title: "الدرس الثالث: الجداول، النماذج (Forms)، وبناء أول صفحة", content: "النماذج تتيح للمستخدمين إدخال البيانات عبر حقول input وأزرار الإرسال.", code: "<form>\n  <input type='text' placeholder='أدخل اسمك'>\n</form>" }
                ],
                quiz: [
                    { q: "ما هو الوسم المسؤول عن إنشاء أكبر عنوان في HTML؟", options: ["<h6>", "<h1>", "<p>", "<br>"], correct: 1 },
                    { q: "أي وسم يُستخدَم لإنشاء رابط تشعبي؟", options: ["<a>", "<link>", "<href>", "<url>"], correct: 0 }
                ]
            },
            "css": {
                title: "تنسيق المواقع CSS3",
                icon: "🎨",
                description: "أتقن توزيع العناصر، الألوان، والتصميم المتجاوب لجميع الشاشات.",
                lessons: [
                    { title: "الدرس الأول: مدخل إلى CSS وطرق ربطها", content: "تمنح CSS الجماليات والألوان للعناصر ويتم ربطها بملف خارجي عبر link.", code: "body { background-color: #0f172a; color: #fff; }" },
                    { title: "الدرس الثاني: الألوان، الخطوط، وتنسيق الصناديق", content: "مفهوم Box Model يتكون من المحتوى، الـ Padding، الـ Border، والـ Margin.", code: ".card { padding: 20px; border-radius: 8px; }" },
                    { title: "الدرس الثالث: نظام التوزيع الحديث Flexbox", content: "أداة Flexbox ترتب العناصر بمرونة فائقة أفقياً أو عمودياً.", code: ".container { display: flex; justify-content: space-between; }" }
                ],
                quiz: [
                    { q: "ما هي الخاصية المسؤولة عن تغيير لون النص في CSS؟", options: ["background-color", "color", "font-size", "text-align"], correct: 1 },
                    { q: "كيف نجعل العناصر تترتب بمرونة بجانب بعضها عبر Flexbox؟", options: ["display: block;", "display: flex;", "float: left;", "position: absolute;"], correct: 1 }
                ]
            },
            "js": {
                title: "جافاسكريبت Vanilla JS",
                icon: "⚡",
                description: "اجعل موقعك تفاعلياً وتحكم في عناصر الصفحة بالكامل عبر البرمجة.",
                lessons: [
                    { title: "الدرس الأول: المتغيرات وأنواع البيانات", content: "المتغيرات تُنشأ بـ let و const لتخزين البيانات في الذاكرة.", code: "const name = 'التهامي';\nlet age = 23;" },
                    { title: "الدرس الثاني: الدوال والشروط البرمجية", content: "الدوال تنفذ مهاماً، والشروط if/else تتخذ القرارات.", code: "if(score >= 50) { console.log('ناجح'); }" },
                    { title: "الدرس الثالث: التفاعل مع المستند (DOM)", content: "عبر DOM تستطيع جافاسكريبت قراءة وتعديل عناصر الصفحة عند الضغط.", code: "document.getElementById('btn').addEventListener('click', () => {});" }
                ],
                quiz: [
                    { q: "بأي كلمة مفتاحية يتم تعريف متغير ثابت لا يتغير في الجافاسكريبت؟", options: ["var", "let", "const", "static"], correct: 2 },
                    { q: "ما هي الدالة التي تُستخدم لعطء رسالة تنبيه منبثقة للمستخدم؟", options: ["alert()", "console.log()", "prompt()", "print()"], correct: 0 }
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id') || 'html';
        const course = COURSES_DATABASE[courseId];

        const storageKey = `webcraft_progress_${courseId}`;
        let completedLessons = JSON.parse(localStorage.getItem(storageKey)) || [];
        let currentActiveIdx = null;

        if(course) {
            document.getElementById('c-title').innerText = course.icon + " " + course.title;
            document.getElementById('c-desc').innerText = course.description;
            document.title = course.title + " | WebCraft Academy";
            renderLessonsList();
            renderQuiz();
            updateProgressUI();
        }

        function renderLessonsList() {
            const lessonsUl = document.getElementById('lessons-list');
            lessonsUl.innerHTML = course.lessons.map((lesson, idx) => {
                const isCompleted = completedLessons.includes(idx);
                return `
                    <li onclick="openLessonModal(${idx})" style="background: rgba(255,255,255,0.03); padding: 14px 18px; border-radius: 10px; border: 1px solid ${isCompleted ? 'rgba(16,185,129,0.3)' : 'rgba(255,255,255,0.08)'}; display: flex; align-items: center; justify-content: space-between; color: #f8fafc; font-size: 0.95rem; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='rgba(99,102,241,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.03)'">
                        <span style="font-weight: 500;">${isCompleted ? '✅' : '📖'} ${lesson.title}</span>
                        <span style="font-size: 0.8rem; background: ${isCompleted ? 'rgba(16,185,129,0.2); color: #34d399;' : 'rgba(99,102,241,0.25); color: #a855f7;'}; padding: 4px 10px; border-radius: 6px; font-weight: bold;">${isCompleted ? 'مكتمل' : 'ابدأ الدرس 🚀'}</span>
                    </li>
                `;
            }).join('');
        }

        function renderQuiz() {
            const quizContainer = document.getElementById('quiz-container');
            if(!course.quiz) return;
            
            quizContainer.innerHTML = course.quiz.map((qObj, qIdx) => `
                <div style="background: rgba(2,6,23,0.5); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.06);">
                    <p style="color: #f8fafc; font-weight: bold; margin-bottom: 12px; font-size: 0.95rem;">س ${qIdx + 1}: ${qObj.q}</p>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        ${qObj.options.map((opt, oIdx) => `
                            <label style="color: #cbd5e1; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="radio" name="q-${qIdx}" value="${oIdx}" style="accent-color: #6366f1;">
                                ${opt}
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function submitQuiz() {
            let score = 0;
            const total = course.quiz.length;
            
            course.quiz.forEach((qObj, qIdx) => {
                const selected = document.querySelector(`input[name="q-${qIdx}"]:checked`);
                if(selected && parseInt(selected.value) === qObj.correct) {
                    score++;
                }
            });

            const resultDiv = document.getElementById('quiz-result');
            resultDiv.style.display = 'block';
            if(score === total) {
                resultDiv.style.color = '#34d399';
                resultDiv.innerText = `🎉 ممتاز جداً يا بشمهندس! أجبت على كل الأسئلة بشكل صحيح (${score}/${total}).`;
            } else {
                resultDiv.style.color = '#f59e0b';
                resultDiv.innerText = `💡 نتيجتك هي (${score}/${total}). راجع الدروس وحاول مرة أخرى لتحقيق العلامة الكاملة!`;
            }
        }

        function openLessonModal(index) {
            currentActiveIdx = index;
            const lesson = course.lessons[index];
            document.getElementById('modal-lesson-title').innerText = lesson.title;
            document.getElementById('modal-lesson-content').innerHTML = lesson.content;
            document.getElementById('modal-lesson-code').innerText = lesson.code;
            updateCompleteButtonStyle();
            document.getElementById('lesson-modal').style.display = 'flex';
        }

        function toggleLessonComplete() {
            if (currentActiveIdx === null) return;
            const index = completedLessons.indexOf(currentActiveIdx);
            if (index > -1) completedLessons.splice(index, 1);
            else completedLessons.push(currentActiveIdx);
            
            localStorage.setItem(storageKey, JSON.stringify(completedLessons));
            renderLessonsList();
            updateProgressUI();
            updateCompleteButtonStyle();
        }

        function updateCompleteButtonStyle() {
            const btn = document.getElementById('complete-btn');
            if (completedLessons.includes(currentActiveIdx)) {
                btn.style.background = 'rgba(16, 185, 129, 0.4)';
                btn.style.color = '#34d399';
                btn.innerText = 'الدرس مكتمل ✅ (انقر للإلغاء)';
            } else {
                btn.style.background = 'rgba(255, 255, 255, 0.05)';
                btn.style.color = '#cbd5e1';
                btn.innerText = 'تحديد كمكتمل ✅';
            }
        }

        function updateProgressUI() {
            const total = course.lessons.length;
            const percentage = Math.round((completedLessons.length / total) * 100);
            document.getElementById('progress-text').innerText = percentage + '%';
            document.getElementById('progress-bar').style.width = percentage + '%';
        }

        function closeLessonModal() {
            document.getElementById('lesson-modal').style.display = 'none';
        }
    </script>
</body>
</html>
