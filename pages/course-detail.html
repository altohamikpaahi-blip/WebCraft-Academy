<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المسار | WebCraft Academy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="dark">
    <header class="navbar glass">
        <div class="nav-container" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
            <a href="../index.html" class="logo"><span class="gradient-text">WebCraft</span> Academy 🚀</a>
            <nav class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="courses.html">التعلم</a>
                <a href="playground.html">المحرر</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 140px; padding-bottom: 60px; max-width: 800px; margin: 0 auto;">
        <div class="glass-card" style="padding: 30px;">
            <h2 id="c-title" style="color: var(--accent); margin-bottom: 15px; font-size: 1.8rem;">جاري تحميل المسار...</h2>
            <p id="c-desc" style="color: var(--text-secondary); margin-bottom: 25px; font-size: 1.05rem;"></p>
            
            <div style="background: rgba(15, 23, 42, 0.9); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);">
                <h3 style="margin-bottom: 15px; color: #f8fafc; font-size: 1.2rem;">📚 محتويات المنهج والشروحات (اضغط على أي درس للبدء):</h3>
                <ul id="lessons-list" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px;">
                    <!-- ستظهر الدروس هنا بتصميم متطور -->
                </ul>
            </div>

            <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 12px;">
                <a href="playground.html" class="btn btn-primary" style="text-decoration: none; text-align: center; padding: 14px; border-radius: 8px; font-weight: bold; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; font-size: 1rem;">الانتقال للمحرر التجريبي 💻</a>
                <a href="courses.html" style="background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; text-decoration: none; text-align: center; font-weight: bold;">العودة للمسارات</a>
            </div>
        </div>
    </main>

    <!-- النافذة المنبثقة المحسنة لعرض الدروس -->
    <div id="lesson-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 15px;">
        <div style="background: #0f172a; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; width: 100%; max-width: 650px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); position: relative; max-height: 90vh; overflow-y: auto; text-align: right; direction: rtl;">
            
            <!-- زر الإغلاق في الزاوية اليمنى العليا للوحة العربية -->
            <button onclick="closeLessonModal()" style="position: absolute; top: 15px; left: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
            
            <h3 id="modal-lesson-title" style="color: var(--accent); margin-bottom: 20px; font-size: 1.35rem; padding-left: 40px; line-height: 1.5;"></h3>
            
            <div style="margin-bottom: 20px;">
                <h4 style="color: #38bdf8; margin-bottom: 10px; font-size: 1rem;">📖 شرح الدرس المفصل:</h4>
                <p id="modal-lesson-content" style="color: #cbd5e1; font-size: 1rem; line-height: 1.9;"></p>
            </div>

            <div style="background: #020617; padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="color: #94a3b8; font-size: 0.85rem;">💻 الكود والتطبيق العملي:</span>
                    <span style="background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">مثال قياسي</span>
                </div>
                <!-- منطقة الكود بتنسيق LTR دقيق لسهولة قراءة الشفرة -->
                <pre style="direction: ltr; text-align: left; background: #090d16; padding: 14px; border-radius: 8px; overflow-x: auto; color: #38bdf8; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; margin: 0; line-height: 1.6;"><code id="modal-lesson-code"></code></pre>
            </div>

            <button onclick="closeLessonModal()" style="width: 100%; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; box-shadow: 0 4px 15px rgba(99,102,241,0.4);">إغلاق والعودة للمنهج ✅</button>
        </div>
    </div>

    <script>
        // قاعدة بيانات احترافية ومفصلة لكل مسار
        const COURSES_DATABASE = {
            "html": {
                title: "أساسيات HTML5",
                icon: "🧱",
                description: "تعلم هيكلة صفحات الويب وكتابة العناصر الأساسية بطريقة احترافية.",
                lessons: [
                    {
                        title: "الدرس الأول: مقدمة إلى الويب وهيكل لغة HTML",
                        content: "لغة HTML (اختصاراً لـ HyperText Markup Language) هي حجر الأساس لأي صفحة وب. تُستخدم لوصف هيكل الصفحة عبر عناصر ومكونات تُحاط بوسوم (Tags). تبدأ أي صفحة سليمة بإعلان نوع المستند <!DOCTYPE html> يليه وسم <html> الأساسي.",
                        code: "<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\">\n    <title>موقعي الأول</title>\n  </head>\n  <body>\n    <h1>أهلاً بك في عالم برمجة الويب</h1>\n  </body>\n</html>"
                    },
                    {
                        title: "الدرس الثاني: الوسوم الأساسية، النصوص، والروابط",
                        content: "في هذا الدرس نتعرف على كيفية بناء المحتوى النصي. تستخدم وسوم العناوين من <h1> إلى <h6> لتدرج العناوين، والوسم <p> لكتابة الفقرات، بينما يتيح الوسم <a> مع خاصية href ربط صفحتك بالمواقع الخارجية.",
                        code: "<h1>عنوان رئيسي بارز</h1>\n<p>هذه فقرة نصية توضح محتوى الدرس بشكل مبسط.</p>\n<a href=\"https://github.com\" target=\"_blank\">انقر هنا لزيارة موقع قيت هب</a>"
                    },
                    {
                        title: "الدرس الثالث: الجداول، النماذج (Forms)، وبناء أول صفحة",
                        content: "التفاعل الحقيقي يبدأ من النماذج (Forms) والتي تمكن المستخدمين من إدخال بياناتهم مثل أسماء المستخدمين وكلمات المرور عبر حقول <input> وأزرار الإرسال <button>.",
                        code: "<form>\n  <label>اسم المستخدم:</label><br>\n  <input type=\"text\" placeholder=\"أدخل اسمك هنا\"><br><br>\n  <button type=\"submit\">إرسال البيانات</button>\n</form>"
                    }
                ]
            },
            "css": {
                title: "تنسيق المواقع CSS3",
                icon: "🎨",
                description: "أتقن توزيع العناصر، الألوان، والتصميم المتجاوب لجميع الشاشات.",
                lessons: [
                    {
                        title: "الدرس الأول: مدخل إلى CSS وطرق ربطها",
                        content: "تمنح لغة CSS الأسلوب والجمال لعناصر HTML. يتم كتابة القواعد عبر تحديد العنصر (Selector) ثم تطبيق الخصائص والأقواس المعقوفة. يتم ربط الملف الخارجي عبر وسم <link> داخل الـ head.",
                        code: "body {\n  background-color: #0f172a;\n  color: #f8fafc;\n  font-family: 'Segoe UI', Tahoma, sans-serif;\n}"
                    },
                    {
                        title: "الدرس الثاني: الألوان، الخطوط، وتنسيق الصناديق",
                        content: "مفهوم نموذج الصندوق (Box Model) هو الأساس في تصميم الواجهات؛ حيث يحيط بكل عنصر حشو داخلي (Padding)، وإطار (Border)، وهامش خارجي (Margin) لتنظيم المسافات.",
                        code: ".card-box {\n  padding: 20px;\n  border: 1px solid rgba(255,255,255,0.1);\n  background: rgba(255,255,255,0.05);\n  border-radius: 12px;\n}"
                    },
                    {
                        title: "الدرس الثالث: نظام التوزيع الحديث Flexbox",
                        content: "يُعتبر Flexbox الثورة الحديثة في توزيع العناصر بمرونة فائقة داخل الحاويات، مما يتيح محاذاة العناصر أفقياً أو عمودياً وضمان تجاوبها التام مع مختلف أحجام الهواتف.",
                        code: ".flex-container {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}"
                    }
                ]
            },
            "js": {
                title: "جافاسكريبت Vanilla JS",
                icon: "⚡",
                description: "اجعل موقعك تفاعلياً وتحكم في عناصر الصفحة بالكامل عبر البرمجة.",
                lessons: [
                    {
                        title: "الدرس الأول: المتغيرات وأنواع البيانات",
                        content: "المتغيرات هي الحاويات التي نحفظ فيها القيم البرمجية. نستخدم let للقيم المتغيرة و const للثوابت. تتيح لنا جافاسكريبت التعامل مع النصوص، الأرقام، والمصفوفات.",
                        code: "const studentName = 'التهامي';\nlet studentAge = 23;\nconsole.log('مرحباً بك يا ' + studentName);"
                    },
                    {
                        title: "الدرس الثاني: الدوال والشروط البرمجية",
                        content: "الدوال (Functions) هي كتل برمجية تؤدي مهمة محددة عند استدعائها، بينما الجمل الشرطية (if/else) تمنح التطبيق القدرة على اتخاذ القرارات بناءً على القيم المدخلة.",
                        code: "function checkScore(score) {\n  if (score >= 50) {\n    return 'ناجح وممتاز';\n  } else {\n    return 'يحتاج إلى تحسين';\n  }\n}"
                    },
                    {
                        title: "الدرس الثالث: التفاعل مع المستند (DOM)",
                        content: "نموذج كائن المستند (DOM) هو الجسر الذي تربط به جافاسكريبت عناصر الصفحة، مما يسمح بالاستجابة لنقرات المستخدم وتغيير النصوص أو الألوان ديناميكياً.",
                        code: "document.getElementById('myBtn').addEventListener('click', function() {\n  alert('تم تنفيذ الحدث بنجاح!');\n});"
                    }
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id') || 'html';
        const course = COURSES_DATABASE[courseId];

        if(course) {
            document.getElementById('c-title').innerText = course.icon + " " + course.title;
            document.getElementById('c-desc').innerText = course.description;
            document.title = course.title + " | WebCraft Academy";
            
            const lessonsUl = document.getElementById('lessons-list');
            lessonsUl.innerHTML = course.lessons.map((lesson, idx) => `
                <li onclick="openLessonModal(${idx})" style="background: rgba(255,255,255,0.03); padding: 14px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; color: #f8fafc; font-size: 0.95rem; cursor: pointer; transition: 0.2s;" onmouseover="this.style.background='rgba(99,102,241,0.15)'" onmouseout="this.style.background='rgba(255,255,255,0.03)'">
                    <span style="font-weight: 500;">📖 ${lesson.title}</span>
                    <span style="font-size: 0.8rem; background: rgba(99,102,241,0.25); color: #a855f7; padding: 4px 10px; border-radius: 6px; white-space: nowrap; font-weight: bold;">استعراض 🚀</span>
                </li>
            `).join('');
        } else {
            document.getElementById('c-title').innerText = "عذراً، المسار غير موجود";
            document.getElementById('c-desc').innerText = "يرجى العودة إلى صفحة المسارات واختيار مسار صحيح.";
        }

        function openLessonModal(index) {
            const lesson = course.lessons[index];
            if(lesson) {
                document.getElementById('modal-lesson-title').innerText = lesson.title;
                document.getElementById('modal-lesson-content').innerText = lesson.content;
                document.getElementById('modal-lesson-code').innerText = lesson.code;
                document.getElementById('lesson-modal').style.display = 'flex';
            }
        }

        function closeLessonModal() {
            document.getElementById('lesson-modal').style.display, document.getElementById('lesson-modal').style.display = 'none';
        }
    </script>
</body>
</html>
