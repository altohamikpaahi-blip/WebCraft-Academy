<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المسار | WebCraft Academy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="dark">
    <header class="navbar glass">
        <div class="nav-container" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
            <a href="../index.html" class="logo"><span class="gradient-text">WebCraft</span> Academy 🚀</a>
            <nav class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="courses.html">التعلم</a>
                <a href="playground.html">المحرر</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 140px; padding-bottom: 60px;">
        <div class="glass-card" style="padding: 30px;">
            <h2 id="c-title" style="color: var(--accent); margin-bottom: 15px;">جاري تحميل المسار...</h2>
            <p id="c-desc" style="color: var(--text-secondary); margin-bottom: 25px; font-size: 1.1rem;"></p>
            
            <div style="background: rgba(15, 23, 42, 0.8); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                <h3 style="margin-bottom: 15px; color: #f8fafc;">محتويات المنهج والدروس:</h3>
                <ul style="padding-right: 20px; color: #94a3b8; display: flex; flex-direction: column; gap: 10px;">
                    <li>الدرس الأول: مقدمة شاملة وأساسيات بناء البيئة البرمجية</li>
                    <li>الدرس الثاني: التطبيق العملي وكتابة الأكواد الأولى</li>
                    <li>الدرس الثالث: تنفيذ مشروع مصغر واختبار المهارات</li>
                </ul>
            </div>

            <div style="margin-top: 30px; display: flex; gap: 15px; flex-wrap: wrap;">
                <a href="playground.html" class="btn btn-primary" style="text-decoration: none; flex: 1; text-align: center; padding: 12px;">الانتقال للمحرر التجريبي 💻</a>
                <a href="courses.html" style="background: transparent; color: white; border: 1px solid rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 8px; text-decoration: none; text-align: center;">العودة للمسارات</a>
            </div>
        </div>
    </main>

    <script src="../data/courses.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');
        
        if(typeof COURSES_DATA !== 'undefined') {
            const course = COURSES_DATA.find(c => c.id === courseId);
            if(course) {
                document.getElementById('c-title').innerText = course.icon + " " + course.title;
                document.getElementById('c-desc').innerText = course.description;
                document.title = course.title + " | WebCraft Academy";
            } else {
                document.getElementById('c-title').innerText = "عذراً، المسار غير موجود";
                document.getElementById('c-desc').innerText = "يرجى العودة إلى صفحة المسارات واختيار مسار صحيح.";
            }
        }
    </script>
</body>
</html>
