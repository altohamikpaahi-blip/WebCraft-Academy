<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسارات التعليمية | WebCraft Academy</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="dark">
    <header class="navbar glass">
        <div class="nav-container" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;">
            <a href="../index.html" class="logo"><span class="gradient-text">WebCraft</span> Academy 🚀</a>
            <nav class="nav-links">
                <a href="../index.html">الرئيسية</a>
                <a href="courses.html" class="active">التعلم</a>
                <a href="playground.html">المحرر</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 140px; padding-bottom: 60px;">
        <div style="text-align: center; margin-bottom: 40px;">
            <h2>جميع مسارات التعلم</h2>
            <p style="color: var(--text-secondary);">اختر المسار الذي يناسب مستواك وابدأ الآن</p>
        </div>
        <div id="all-courses-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;"></div>
        
        <!-- قسم عرض محتوى المسار عند الضغط -->
        <div id="course-details" style="margin-top: 40px; display: none;" class="glass-card">
            <h3 id="details-title" style="color: var(--accent); margin-bottom: 10px;"></h3>
            <p id="details-desc" style="color: var(--text-secondary); margin-bottom: 15px;"></p>
            <div style="background: rgba(15, 23, 42, 0.6); padding: 15px; border-radius: 8px;">
                <h4 style="margin-bottom: 8px;">الدروس المتاحة في المسار:</h4>
                <ul id="lessons-list" style="padding-right: 20px; color: #f8fafc;">
                    <li>مقدمة ومدخل شامل للمسار</li>
                    <li>تطبيق عملي وبناء مشروع حقيقي</li>
                </ul>
            </div>
        </div>
    </main>

    <script src="../data/courses.js"></script>
    <script>
        const grid = document.getElementById('all-courses-grid');
        if(grid && typeof COURSES_DATA !== 'undefined') {
            grid.innerHTML = COURSES_DATA.map(c => `
                <div style="background: rgba(19, 28, 49, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px;">
                    <div style="font-size: 2rem; margin-bottom: 10px;">${c.icon}</div>
                    <span style="font-size: 0.8rem; background: rgba(99,102,241,0.2); padding: 4px 8px; border-radius: 4px; color: #a855f7;">${c.level}</span>
                    <h3 style="margin: 10px 0; color: #f8fafc;">${c.title}</h3>
                    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">${c.description}</p>
                    <button onclick="openCourse('${c.title}', '${c.description}')" style="width: 100%; cursor: pointer; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; padding: 10px; border: none; border-radius: 8px; font-weight: bold; font-family: system-ui, sans-serif;">دخول المسار</button>
                </div>
            `).join('');
        }

        function openCourse(title, desc) {
            const detailsDiv = document.getElementById('course-details');
            document.getElementById('details-title').innerText = "مسار: " + title;
            document.getElementById('details-desc').innerText = desc;
            detailsDiv.style.display = 'block';
            detailsDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
